<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAX BEAUTY</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter';
      background: #0b0b0b;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      padding: 20px 40px;
      background: #111;
    }

    .logo {
      font-family: 'Playfair Display';
      color: #d4af37;
      font-size: 24px;
    }

    nav button {
      margin-left: 10px;
      background: transparent;
      border: 1px solid #333;
      color: white;
    }

    .hero {
      height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .hero h1 {
      font-family: 'Playfair Display';
      font-size: 50px;
    }

    .btn {
      background: #d4af37;
      color: black;
      padding: 12px 20px;
      border: none;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      padding: 40px;
    }

    .card {
      background: #121212;
      padding: 20px;
      border-radius: 14px;
    }

    .price {
      color: #d4af37;
    }

    .cart {
      max-width: 600px;
      margin: auto;
      padding: 40px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      background: #1a1a1a;
      border: none;
      color: white;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    (function () { emailjs.init("PUBLIC_KEY"); })(); // ⚠️ mete a tua key
  </script>

</head>

<body>

  <header>
    <div class="logo">LAX BEAUTY</div>
    <nav>
      <button onclick="go('home')">Home</button>
      <button onclick="go('shop')">Produtos</button>
      <button onclick="go('cart')">Carrinho (<span id="count">0</span>)</button>
    </nav>
  </header>

  <div id="app"></div>

  <footer>© LAX BEAUTY</footer>

  <script>

    const products = [
      { id: 1, name: "Radiance Cream", price: 29.99 },
      { id: 2, name: "Glow Serum", price: 34.99 },
      { id: 3, name: "Lipstick Velvet", price: 18.5 }
    ];

    let cart = [];
    let page = "home";

    function go(p) { page = p; render(); }

    function add(id) {
      const p = products.find(x => x.id === id);
      const e = cart.find(x => x.id === id);
      if (e) { e.qty++; } else { cart.push({ ...p, qty: 1 }); }
      updateCount();
    }

    function updateCount() {
      document.getElementById("count").innerText =
        cart.reduce((a, c) => a + c.qty, 0);
    }

    function render() {
      const app = document.getElementById("app");

      if (page === "home") {
        app.innerHTML = `
<div class="hero">
<h1>Luxury Beauty</h1>
<p>Descobre a tua melhor versão</p>
<button class="btn" onclick="go('shop')">Comprar</button>
</div>`;
      }

      if (page === "shop") {
        app.innerHTML = `
<div class="grid">
${products.map(p => `
<div class="card">
<h3>${p.name}</h3>
<p class="price">€${p.price}</p>
<button class="btn" onclick="add(${p.id})">Adicionar</button>
</div>`).join("")}
</div>`;
      }

      if (page === "cart") {
        const total = cart.reduce((a, i) => a + i.price * i.qty, 0);

        app.innerHTML = `
<div class="cart">

${cart.map(i => `
<div>${i.name} x${i.qty}</div>
`).join("")}

<h2>Total: €${total.toFixed(2)}</h2>

<input placeholder="Nome">
<input placeholder="Morada">
<input placeholder="Email">

<button class="btn" onclick="finalizarCompra()">Finalizar Compra</button>

</div>`;
      }
    }

    function finalizarCompra() {

      const name = document.querySelector("input[placeholder='Nome']").value;
      const address = document.querySelector("input[placeholder='Morada']").value;
      const email = document.querySelector("input[placeholder='Email']").value;

      if (!name || !address || !email) {
        showMessage("Preenche todos os campos!", true);
        return;
      }

      const items = cart.map(i => `${i.name} x${i.qty}`).join(", ");
      const total = cart.reduce((a, i) => a + i.price * i.qty, 0).toFixed(2);
      const orderId = "LAX-" + Date.now();

      emailjs.send("SERVICE_ID", "TEMPLATE_ID", {
        to_email: "beziinhalucaz@gmail.com",
        customer_name: name,
        customer_email: email,
        customer_address: address,
        order_items: items,
        order_total: total,
        order_id: orderId
      })
        .then(() => {

          document.getElementById("app").innerHTML = `
      <div style="text-align:center;padding:60px">
        <h1 style="color:#d4af37">✔ Encomenda Confirmada</h1>
        <p>Obrigado pela tua compra!</p>
        <p><b>ID:</b> ${orderId}</p>
        <button class="btn" onclick="go('home')">Voltar</button>
      </div>
    `;

          cart = [];
          updateCount();

        })
        .catch(() => {
          showMessage("Erro ao enviar encomenda.", true);
        });
    }

    function showMessage(text, isError = false) {
      const msg = document.createElement("div");
      msg.innerText = text;

      msg.style.position = "fixed";
      msg.style.bottom = "20px";
      msg.style.left = "50%";
      msg.style.transform = "translateX(-50%)";
      msg.style.background = isError ? "#ff4d4d" : "#28a745";
      msg.style.color = "white";
      msg.style.padding = "12px 20px";
      msg.style.borderRadius = "8px";

      document.body.appendChild(msg);
      setTimeout(() => msg.remove(), 3000);
    }

    render();
  </script>

</body>

</html>
